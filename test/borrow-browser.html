<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>虚拟卡片 · MMR 旁粗估验收</title>
<link rel="stylesheet" href="../content.css"><style>body{font:16px system-ui;background:#f3f6f8;margin:16px;color:#465767}.ant-card{box-sizing:border-box;background:white;border:1px solid #dce1e5;border-radius:10px;margin:16px 0;width:480px;max-width:100%;box-shadow:0 2px 3px #0001}.ant-card-head{display:flex;background:#d5ffe5;padding:12px;border-radius:10px 10px 0 0;color:#152a31}.ant-card-body{padding:0 12px}.pair-name-link{font-weight:bold}.ant-tag{padding:2px 6px;border-radius:4px}.ant-tag-gold{background:#fff8e5;color:#b57902}.ant-tag-green{background:#f0ffe7;color:#509800}.margin-marker{background:#e5f3ff;color:#1689c9}button{cursor:pointer}#status{display:block;font-size:13px;margin:8px 0}.mmr-row{display:flex;align-items:center}.controls{max-width:480px;display:flex;gap:8px;flex-wrap:wrap}.controls button{padding:6px}</style>
<h2>虚拟数据验收</h2><p>运行实际插件脚本，账户读取使用模拟数据。</p>
<div class="ant-card"><div class="ant-card-head"><div><span>已启用　</span><span class="pair-name-link">DEMO</span></div></div><div class="ant-card-body"><p>交易所: <span class="ant-tag ant-tag-gold">binance</span> <span id="venue" class="ant-tag ant-tag-green">bitget</span> <span id="mode" class="margin-marker">全</span></p><p>仓位价值(U): 5000 / 5000</p><p>开仓均价: 0.8000 / 0.8000</p><p id="quantity">仓位数量: 5000 / 5000</p><p>实时费率: +0.0073 / 4h</p><p class="mmr-row"><span>实时MMR: </span><span>2.05% / 10.00%</span></p><p>爆率/ADL: -- ● | --</p></div></div>
<div class="controls"><button id="isolated">逐仓</button><button id="spot">普通现货</button><button id="ff">FF</button><button id="empty">清仓</button><button id="cross">恢复全仓借币</button><button id="danger">100% 临界值</button><button id="fail">模拟读取失败</button></div><output id="status"></output>
<script src="../rough-risk.js"></script><script>
let failed=false,requests=0,margin=10000;
window.chrome={storage:{local:{get:async()=>({siteOrigin:location.origin})},onChanged:{addListener(){},removeListener(){}}},runtime:{sendMessage:async m=>{if(m.type!=='read-frontend-risk')return {state:'unknown',checkedAt:Date.now()};requests++;document.getElementById('status').textContent='账户读取次数：'+requests; if(failed)return{ok:false,error:'模拟网络失败'};return{ok:true,report:FundingRadarRoughRisk.analyze({capturedAt:Date.now(),pairs:[{id:'one',type:'FS',spotMarginType:'cross',name:'DEMO',sellEx:'bitget',bExPosition:5000}],accounts:{bitget:{displayedMargin:margin,mmr:0.1,spot:{},future:{},prices:{DEMO:1}}}})};}}};
document.getElementById('isolated').onclick=()=>document.getElementById('mode').textContent='逐';
document.getElementById('spot').onclick=()=>document.getElementById('mode').textContent='';
document.getElementById('ff').onclick=()=>document.getElementById('venue').className='ant-tag ant-tag-gold';
document.getElementById('empty').onclick=()=>document.getElementById('quantity').textContent='仓位数量: 0 / 0';
document.getElementById('cross').onclick=()=>{failed=false;document.getElementById('mode').textContent='全';document.getElementById('venue').className='ant-tag ant-tag-green';document.getElementById('quantity').textContent='仓位数量: 5000 / 5000';};
document.getElementById('danger').onclick=()=>{margin=6250;document.dispatchEvent(new Event('visibilitychange'));};
document.getElementById('fail').onclick=()=>{failed=true;document.dispatchEvent(new Event('visibilitychange'));};
</script><script src="../linking.js"></script><script src="../limits.js"></script><script src="../alerts.js"></script><script src="../risk-inline.js"></script><script src="../content.js"></script></html>
